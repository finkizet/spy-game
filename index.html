<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Spy Game</title>

<style>
    body {
        background: #0f172a;
        font-family: Arial, sans-serif;
        color: #f8fafc;
        margin: 0;
        padding: 0;
        text-align: center;
    }

    h1 { margin-top: 20px; }

    .section {
        margin: 25px auto;
        padding: 20px;
        width: 90%;
        max-width: 600px;
        background: #1e293b;
        border-radius: 12px;
        box-shadow: 0 0 12px #0006;
    }

    select, input {
        padding: 10px;
        margin-top: 10px;
        background: #020617;
        border: 1px solid #334155;
        color: #f1f5f9;
        border-radius: 8px;
    }

    button {
        padding: 10px 18px;
        margin-top: 10px;
        background: #334155;
        border: none;
        border-radius: 8px;
        color: white;
        cursor: pointer;
    }

    #lobbyBox {
        margin-top: 20px;
        padding: 15px;
        background: #0f1a30;
        border: 1px solid #334155;
        border-radius: 8px;
        display: none;
    }

    #playersList {
        text-align: left;
        padding-left: 20px;
        margin-top: 10px;
        white-space: pre-line;
    }

    #startGameBtn { display: none; }
</style>

</head>
<body>

<h1>Spy Game</h1>

<!-- ---------- ЯЗЫК ---------- -->
<div>
    <select id="langSelectTop">
        <option value="ru">RU</option>
        <option value="en">EN</option>
    </select>
</div>

<!-- ---------- РЕЖИМ: ЛОКАЛЬНАЯ ИГРА ---------- -->
<div class="section">
    <h2 id="localTitle">Локальная игра (без лобби)</h2>

    <label id="labelGame" for="gameMode"></label>
    <select id="gameMode">
        <option value="clash"></option>
        <option value="dota"></option>
    </select>

    <br><br>

    <label id="labelSeed" for="seedInput"></label>
    <input id="seedInput" placeholder="123456" />

    <button id="localPlayBtn"></button>
    <p id="localResult"></p>
</div>

<!-- ---------- РЕЖИМ: ОНЛАЙН ЛОББИ ---------- -->
<div class="section">
    <h2 id="onlineTitle">Онлайн-лобби</h2>

    <div id="nicknameBlock">
        <label id="labelNick">Ваш ник:</label><br>
        <input id="nickInput" placeholder="Player123" />
        <button id="saveNickBtn">Сохранить ник</button>
    </div>

    <hr>

    <button id="createLobbyBtn">Создать лобби</button>
    <br>
    <input id="joinLobbyInput" placeholder="Код лобби" style="margin-top:10px;">
    <button id="joinLobbyBtn">Войти</button>

    <div id="lobbyBox">
        <h3 id="lobbyTitle">Лобби</h3>
        <p id="lobbyIdText"></p>
        <p id="playerCount"></p>

        <div id="playersList"></div>

        <button id="startGameBtn">Начать игру</button>
        <button id="showRoleBtn">Показать мою роль</button>
        <p id="roleResult"></p>
    </div>
</div>


<script>
// ----------------------- ЛОКАЛИЗАЦИЯ -----------------------
const i18n = {
    ru: {
        localTitle: "Локальная игра (без лобби)",
        labelGame: "Выберите игру:",
        labelSeed: "Введите общий код:",
        localPlayBtn: "Показать роль",
        onlineTitle: "Онлайн-лобби",
        labelNick: "Ваш ник:",
        createLobby: "Создать лобби",
        joinLobby: "Войти",
    },
    en: {
        localTitle: "Local game (offline)",
        labelGame: "Choose game:",
        labelSeed: "Enter shared seed:",
        localPlayBtn: "Show role",
        onlineTitle: "Online Lobby",
        labelNick: "Your nickname:",
        createLobby: "Create lobby",
        joinLobby: "Join",
    }
};

let lang = localStorage.getItem("lang") || "ru";
document.getElementById("langSelectTop").value = lang;

function applyLang() {
    const t = i18n[lang];
    document.getElementById("localTitle").innerText = t.localTitle;
    document.getElementById("labelGame").innerText = t.labelGame;
    document.getElementById("labelSeed").innerText = t.labelSeed;
    document.getElementById("localPlayBtn").innerText = t.localPlayBtn;
    document.getElementById("onlineTitle").innerText = t.onlineTitle;
    document.getElementById("labelNick").innerText = t.labelNick;

    document.getElementById("createLobbyBtn").innerText = t.createLobby;
    document.getElementById("joinLobbyBtn").innerText = t.joinLobby;
}
applyLang();

document.getElementById("langSelectTop").onchange = e => {
    lang = e.target.value;
    localStorage.setItem("lang", lang);
    applyLang();
};

// ----------------------- GAME MODES (СОКРАЩЁННЫЕ) -----------------------
const gameModes = {
    clash: {
        title: { ru: "Clash Royale", en: "Clash Royale" },
        items: [
            { id: "Knight", ru: "Рыцарь" },
            { id: "Archers", ru: "Лучницы" },
            { id: "Giant", ru: "Гигант" }
        ]
    },
    dota: {
        title: { ru: "Dota 2", en: "Dota 2" },
        items: [
            { id: "Pudge", ru: "Пудж" },
            { id: "Invoker", ru: "Инвокер" },
            { id: "Axe", ru: "Топор" }
        ]
    }
};

function fillGameModeNames() {
    const gm = document.getElementById("gameMode").children;
    gm[0].innerText = gameModes.clash.title[lang];
    gm[1].innerText = gameModes.dota.title[lang];
}
fillGameModeNames();

document.getElementById("langSelectTop").addEventListener("change", fillGameModeNames);

// ----------------------- ЛОКАЛЬНАЯ ИГРА -----------------------
document.getElementById("localPlayBtn").onclick = () => {
    const seed = document.getElementById("seedInput").value.trim();
    const game = document.getElementById("gameMode").value;
    if (!seed) return;

    const arr = gameModes[game].items;
    const spyIndex = Math.abs(hash(seed)) % arr.length;

    const role = arr[spyIndex].id;

    document.getElementById("localResult").innerText =
        lang === "ru" ? ("Вы: " + role) : ("You: " + role);
};

function hash(str) {
    let h = 0;
    for (let c of str) h = (h*31 + c.charCodeAt(0)) | 0;
    return h;
}

// ----------------------- ОНЛАЙН ЛОББИ -----------------------
const SERVER = "https://spy-game-clr8.onrender.com"; // твой Render сервер

let nickname = localStorage.getItem("nickname") || "";
document.getElementById("nickInput").value = nickname;

document.getElementById("saveNickBtn").onclick = () => {
    nickname = document.getElementById("nickInput").value.trim();
    if (nickname.length < 2) return;
    localStorage.setItem("nickname", nickname);
};

let lobbyId = null;
let lobbyToken = null;

// Создать лобби
document.getElementById("createLobbyBtn").onclick = async () => {
    if (!nickname) return;

    const res = await fetch(SERVER + "/lobby/create", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ nickname })
    });

    const data = await res.json();
    lobbyId = data.lobbyId;
    lobbyToken = data.token;

    localStorage.setItem("lastLobbyId", lobbyId);
    localStorage.setItem("lobby_token_" + lobbyId, lobbyToken);

    showLobbyUI();
    connectWS();
};

// Войти в лобби
document.getElementById("joinLobbyBtn").onclick = async () => {
    const code = document.getElementById("joinLobbyInput").value.trim();
    if (!code || !nickname) return;

    const res = await fetch(SERVER + "/lobby/" + code + "/join", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ nickname })
    });

    const data = await res.json();
    if (!data.ok) return;

    lobbyId = code;
    lobbyToken = data.token;

    localStorage.setItem("lastLobbyId", lobbyId);
    localStorage.setItem("lobby_token_" + lobbyId, lobbyToken);

    showLobbyUI();
    connectWS();
};

// Показ UI
function showLobbyUI() {
    document.getElementById("lobbyBox").style.display = "block";
    document.getElementById("lobbyIdText").innerText = "Код лобби: " + lobbyId;
}

// WebSocket
let ws = null;
function connectWS() {
    ws = new WebSocket(SERVER.replace("https", "wss") + "/ws/" + lobbyId + "/" + lobbyToken);

    ws.onmessage = ev => {
        const msg = JSON.parse(ev.data);

        if (msg.type === "players") {
            updatePlayers(msg.players);
        }

        if (msg.type === "role") {
            document.getElementById("roleResult").innerText =
                (lang === "ru" ? "Ваша роль: " : "Your role: ") + msg.role;
        }

        if (msg.type === "admin") {
            document.getElementById("startGameBtn").style.display = "inline-block";
        }
    };
}

function updatePlayers(players) {
    document.getElementById("playerCount").innerText = players.length + "/10";
    let s = "";
    for (let p of players) {
        s += p.nickname + (p.isAdmin ? " *" : "") + "\n";
    }
    document.getElementById("playersList").innerText = s;
}

// Начать раунд
document.getElementById("startGameBtn").onclick = () => {
    ws.send(JSON.stringify({ type: "startRound" }));
};

// Показ роли
document.getElementById("showRoleBtn").onclick = () => {
    ws.send(JSON.stringify({ type: "getRole" }));
};
</script>
</body>
</html>
