<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Spy Game</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #0f172a;
            color: #e2e8f0;
            margin: 0;
            padding: 0;
            text-align: center;
        }

        h1 {
            margin-top: 20px;
        }

        #main {
            max-width: 420px;
            margin: 0 auto;
            padding: 20px;
        }

        input, button, select {
            padding: 10px;
            margin: 5px 0;
            width: 100%;
            border-radius: 8px;
            border: 1px solid #475569;
            background: #1e293b;
            color: white;
        }

        #lobbyContainer {
            margin-top: 20px;
            padding: 15px;
            background: #1e293b;
            border-radius: 12px;
            display: none;
        }

        #playersList div {
            padding: 6px 0;
            border-bottom: 1px solid #475569;
        }

        .adminMark {
            color: #38bdf8;
        }

        #startGameBtn {
            background: #16a34a;
            border: none;
        }

        #leaveBtn {
            background: #dc2626;
            border: none;
            margin-top: 10px;
        }

        #roleBlock {
            display: none;
            margin-top: 20px;
            padding: 15px;
            background: #1e293b;
            border-radius: 12px;
        }
    </style>

    <script>
        /* ======================
           🔥 ЛОКАЛЬНЫЙ НИКНЕЙМ
        ====================== */
        function loadNickname() {
            const saved = localStorage.getItem("nickname");
            if (saved) document.getElementById("nicknameInput").value = saved;
        }

        function saveNickname() {
            const nick = document.getElementById("nicknameInput").value.trim();
            if (nick.length < 2) return alert("Ник должен быть длиннее 2 символов");
            localStorage.setItem("nickname", nick);
            alert("Ник сохранён!");
        }

        /* ======================
           🔥 GAME MODES (оставлено коротко)
        ====================== */
        const gameModes = {
            clash: {
                title: { ru: "Clash Royale", en: "Clash Royale" },
                items: [
                    { id: "Knight", ru: "Рыцарь" },
                    { id: "Archers", ru: "Лучницы" },
                    // ...
                ],
                label: { ru: "карта из Clash Royale", en: "card from Clash Royale" }
            },
            dota: {
                title: { ru: "Dota 2", en: "Dota 2" },
                items: [
                    { id: "Pudge", ru: "Падж" },
                    { id: "Invoker", ru: "Инвокер" },
                    // ...
                ],
                label: { ru: "герой из Dota 2", en: "hero from Dota 2" }
            }
        };

        /* ======================
           🔥 ПОДКЛЮЧЕНИЕ К WS
        ====================== */
        let socket = null;
        let currentLobbyId = null;
        let currentToken = null;
        let isAdmin = false;

        const SERVER_WS = "wss://spy-game-clr8.onrender.com";  // твой WebSocket адрес

        function connectWS() {
            socket = new WebSocket(SERVER_WS);

            socket.onmessage = (ev) => {
                const msg = JSON.parse(ev.data);

                if (msg.type === "lobby_update") {
                    renderLobby(msg.lobby);
                }

                if (msg.type === "role") {
                    document.getElementById("myRole").innerText = msg.roleText;
                    document.getElementById("roleBlock").style.display = "block";
                }
            };
        }

        /* ======================
           🔥 СОЗДАНИЕ ЛОББИ
        ====================== */
        async function createLobby() {
            const nickname = document.getElementById("nicknameInput").value.trim();
            if (!nickname) return alert("Введите ник");

            const res = await fetch("/create", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ nickname })
            });

            const data = await res.json();
            currentLobbyId = data.lobbyId;
            currentToken = data.token;
            isAdmin = true;

            localStorage.setItem("lastLobbyId", currentLobbyId);
            localStorage.setItem("lobby_token_" + currentLobbyId, currentToken);

            document.getElementById("lobbyContainer").style.display = "block";
            document.getElementById("lobbyCode").innerText = currentLobbyId;

            connectWS();
        }

        /* ======================
           🔥 ВХОД В ЛОББИ
        ====================== */
        async function joinLobby() {
            const nickname = document.getElementById("nicknameInput").value.trim();
            const code = document.getElementById("joinCode").value.trim();

            if (!nickname || !code) return alert("Введите ник и код");

            const res = await fetch("/join", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ nickname, lobbyId: code })
            });

            const data = await res.json();

            if (!data.ok) return alert(data.error);

            currentLobbyId = code;
            currentToken = data.token;
            isAdmin = false;

            localStorage.setItem("lastLobbyId", currentLobbyId);
            localStorage.setItem("lobby_token_" + currentLobbyId, currentToken);

            document.getElementById("lobbyContainer").style.display = "block";
            document.getElementById("lobbyCode").innerText = currentLobbyId;

            connectWS();
        }

        /* ======================
           🔥 ПОЛУЧИТЬ РОЛЬ
        ====================== */
        function getMyRole() {
            socket.send(JSON.stringify({
                type: "get_role",
                lobbyId: currentLobbyId,
                token: currentToken
            }));
        }

        /* ======================
           🔥 ОБНОВЛЯЕМ СПИСОК ИГРОКОВ
        ====================== */
        function renderLobby(lobby) {
            const list = document.getElementById("playersList");
            list.innerHTML = "";

            lobby.players.forEach(p => {
                const div = document.createElement("div");
                div.innerHTML = p.nickname + (p.isAdmin ? " <span class='adminMark'>★</span>" : "");
                list.appendChild(div);
            });

            document.getElementById("playerCount").innerText =
                lobby.players.length + "/10";

            document.getElementById("startGameBtn").disabled =
                !(isAdmin && lobby.players.length >= 3);
        }

    </script>
</head>

<body onload="loadNickname()">
    <h1>Spy Game</h1>

    <div id="main">
        <input id="nicknameInput" placeholder="Ваш ник" />
        <button onclick="saveNickname()">Сохранить ник</button>

        <hr>

        <button onclick="createLobby()">Создать лобби</button>

        <input id="joinCode" placeholder="Код лобби" />
        <button onclick="joinLobby()">Войти</button>
    </div>

    <!-- =======================
         🔥 ЛОББИ
    ======================= -->
    <div id="lobbyContainer">
        <h2>Лобби: <span id="lobbyCode"></span></h2>
        <div>Игроки: <span id="playerCount">0/10</span></div>

        <div id="playersList"></div>

        <button id="startGameBtn" disabled>Начать игру</button>

        <button id="leaveBtn">Покинуть лобби</button>
    </div>

    <!-- =======================
         🔥 МОЯ РОЛЬ
    ======================= -->
    <div id="roleBlock">
        <h3>Ваша роль:</h3>
        <div id="myRole" style="font-size: 22px; margin-top: 10px;"></div>
    </div>

</body>
</html>
