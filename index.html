<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <title>finkizet game</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
        * { box-sizing: border-box; }

        body {
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: #0f172a;
            color: #e5e7eb;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 480px;
            padding: 24px 16px 40px;
        }

        h1 {
            font-size: 1.6rem;
            margin-bottom: 8px;
            text-align: center;
        }

        .subtitle {
            font-size: 0.9rem;
            color: #9ca3af;
            text-align: center;
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-size: 0.9rem;
            margin-bottom: 4px;
        }

        input,
        select {
            width: 100%;
            padding: 10px 12px;
            border-radius: 8px;
            border: 1px solid #374151;
            background: #020617;
            color: #e5e7eb;
            font-size: 0.95rem;
            margin-bottom: 14px;
            outline: none;
        }

        input:focus,
        select:focus {
            border-color: #3b82f6;
        }

        button {
            width: 100%;
            padding: 11px 14px;
            border-radius: 999px;
            border: none;
            cursor: pointer;
            font-weight: 600;
            font-size: 1rem;
            background: #3b82f6;
            color: #f9fafb;
            margin-top: 4px;
        }

        button:hover { filter: brightness(1.05); }
        button:active { transform: translateY(1px); }

        .help {
            font-size: 0.8rem;
            color: #9ca3af;
            margin-top: 4px;
            margin-bottom: 12px;
        }

        .result-card {
            margin-top: 18px;
            padding: 14px 16px;
            border-radius: 12px;
            background: #020617;
            border: 1px solid #1f2937;
        }

        .result-title {
            font-size: 0.85rem;
            color: #9ca3af;
            margin-bottom: 6px;
        }

        .role {
            font-size: 1.3rem;
            font-weight: 700;
            margin-bottom: 4px;
        }

        .error {
            margin-top: 12px;
            padding: 10px 12px;
            border-radius: 8px;
            background: rgba(239, 68, 68, 0.08);
            border: 1px solid rgba(239, 68, 68, 0.5);
            color: #fecaca;
            font-size: 0.85rem;
        }

        .small {
            font-size: 0.8rem;
            color: #6b7280;
            margin-top: 16px;
        }

        /* Верхняя панель для выбора языка */
        #langTopBar {
            position: fixed;
            top: 16px;
            right: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
            z-index: 10;
        }

        #langIcon {
            width: 20px;
            height: 20px;
            opacity: 0.9;
        }

        #langSelectTop {
            width: auto;
            min-width: 110px;
            margin: 0;
            padding-inline: 10px;
        }

        @media (max-width: 480px) {
            #langTopBar {
                top: 8px;
                right: 8px;
            }
        }
    </style>
</head>
<body>

<!-- Верхняя панель выбора языка -->
<div id="langTopBar">
    <img src="assets/language.png" id="langIcon" alt="Language" />
    <select id="langSelectTop">
        <option value="ru">Русский</option>
        <option value="en">English</option>
    </select>
</div>

<div class="container">
    <h1 id="heading"></h1>
    <div id="subtitle" class="subtitle"></div>

    <label for="gameMode" id="labelGame"></label>
    <select id="gameMode">
        <option value="clash"></option>
        <option value="dota"></option>
    </select>

    <div id="helpGameMode" class="help"></div>

    <label for="seedInput" id="labelSeed"></label>
    <input id="seedInput" type="text" />

    <div id="helpSeed" class="help"></div>

    <label for="playersInput" id="labelPlayers"></label>
    <input id="playersInput" type="number" min="2" max="10" value="4" />

    <div id="helpPlayers" class="help"></div>

    <label for="playerIndexInput" id="labelPlayerIndex"></label>
    <input id="playerIndexInput" type="number" min="1" max="10" value="1" />

    <div id="helpPlayerIndex" class="help"></div>

    <button id="showRoleBtn"></button>

    <div id="result" class="result-card" style="display:none;">
        <div id="resultTitle" class="result-title"></div>
        <div id="roleText" class="role"></div>
        <div id="extraText" class="small"></div>
    </div>

    <div id="errorBox" class="error" style="display:none;"></div>

    <div id="footerText" class="small"></div>
</div>

<script>
    const gameModes = {
        clash: {
            title: { ru: "Clash Royale", en: "Clash Royale" },
            items: [
                { id: "Knight", ru: "Рыцарь" },
                { id: "Archers", ru: "Лучницы" },
                { id: "Goblin Gang", ru: "Банда гоблинов" },
                { id: "Giant", ru: "Гигант" },
                { id: "P.E.K.K.A", ru: "П.Е.К.К.А" },
                { id: "Mini P.E.K.K.A", ru: "Мини-пекка" },
                { id: "Valkyrie", ru: "Валькирия" },
                { id: "Ice Wizard", ru: "Ледяной колдун" },
                { id: "Wizard", ru: "Маг" },
                { id: "Prince", ru: "Принц" }
            ],
            label: {
                ru: "карта из Clash Royale",
                en: "card from Clash Royale"
            }
        },
        dota: {
            title: { ru: "Dota 2", en: "Dota 2" },
            items: [
                { id: "Pudge" },
                { id: "Invoker" },
                { id: "Juggernaut" },
                { id: "Crystal Maiden" },
                { id: "Phantom Assassin" },
                { id: "Axe" },
                { id: "Shadow Fiend" },
                { id: "Lina" },
                { id: "Lion" },
                { id: "Earthshaker" }
            ],
            label: {
                ru: "герой из Dota 2",
                en: "hero from Dota 2"
            }
        }
    };

    const i18n = {
        ru: {
            pageTitle: "finkizet game",
            heading: "Шпион — мультиигра",
            subtitle: "Выберите игру, договоритесь об одном коде и количестве игроков (максимум 10), затем каждый вводит свой номер игрока и получает роль.",
            labelGame: "Игра",
            helpGameMode: "От выбора игры зависит список карт/героев и формулировки.",
            labelSeed: "Общий код / seed",
            seedPlaceholder: "Например: 548129 или 'pudge42'",
            helpSeed: "Все игроки должны ввести один и тот же код. Можно число или слово.",
            labelPlayers: "Количество игроков",
            helpPlayers: "Максимум — 10 игроков. Всегда 1 шпион, остальные получают одинаковый объект.",
            labelPlayerIndex: "Твой номер игрока",
            helpPlayerIndex: "Каждый выбирает свой уникальный номер. Номер не должен превышать количество игроков.",
            showButton: "Показать мою роль",
            resultTitle: "Твоя роль:",
            footerText: "⚠ Если кто-то введёт другой код или количество игроков — у него будут другие результаты. Для честной игры все должны внимательно вводить данные и не подсматривать.",
            spyRole: "Шпион",
            errors: {
                noSeed: "Введите общий код / seed.",
                playersMin: "Количество игроков должно быть не меньше 2.",
                playersMax: "Максимальное количество игроков — 10.",
                badIndex: "Номер игрока должен быть от 1 до количества игроков.",
                cheat: "Играем честно! Не подсматривай! Если вы считаете это ошибкой, выберите другой код."
            },
            spyText(modeTitle, label) {
                return `Ты шпион в игре ${modeTitle}. Ты НЕ знаешь, какой ${label} выпал другим. Слушай, как остальные описывают его, и пытайся не спалиться.`;
            },
            nonSpyText(modeTitle, label, itemName) {
                return `Тебе выпал ${label}: "${itemName}". У всех остальных не-шпионов такой же ${label}. Не показывай экран, просто запомни и описывай его так, чтобы шпиону было сложно понять, что именно это за ${label}.`;
            }
        },
        en: {
            pageTitle: "finkizet game",
            heading: "Spy — multi game",
            subtitle: "Choose a game, agree on one shared code and player count (up to 10), then each player enters their number and gets a role.",
            labelGame: "Game",
            helpGameMode: "Game selection changes the list of cards/heroes and phrasing.",
            labelSeed: "Shared code / seed",
            seedPlaceholder: "Example: 548129 or 'pudge42'",
            helpSeed: "All players must enter the same code. It can be a number or a word.",
            labelPlayers: "Number of players",
            helpPlayers: "Maximum is 10 players. There is always 1 spy, others get the same object.",
            labelPlayerIndex: "Your player number",
            helpPlayerIndex: "Each player chooses a unique number. It must not exceed the number of players.",
            showButton: "Show my role",
            resultTitle: "Your role:",
            footerText: "⚠ If someone enters a different code or player count, they will get different results. For a fair game everyone should type carefully and not peek.",
            spyRole: "Spy",
            errors: {
                noSeed: "Enter the shared code / seed.",
                playersMin: "Number of players must be at least 2.",
                playersMax: "Maximum number of players is 10.",
                badIndex: "Player number must be between 1 and the total number of players.",
                cheat: "Play fair! Don't peek! If you think this is a mistake, choose another code."
            },
            spyText(modeTitle, label) {
                return `You are the spy in ${modeTitle}. You do NOT know which ${label} everyone else got. Listen to how they describe it and try not to get caught.`;
            },
            nonSpyText(modeTitle, label, itemName) {
                return `You got a ${label}: "${itemName}". All non-spies have the same ${label}. Do not show your screen, just remember it and describe it so the spy cannot easily guess what it is.`;
            }
        }
    };

    function hashStringToInt(str) {
        let h = 0;
        for (let i = 0; i < str.length; i++) {
            h = (h * 31 + str.charCodeAt(i)) | 0;
        }
        return h;
    }

    function mulberry32(seed) {
        let t = seed | 0;
        return function() {
            t += 0x6D2B79F5;
            let r = t;
            r = Math.imul(r ^ (r >>> 15), r | 1);
            r ^= r + Math.imul(r ^ (r >>> 7), r | 61);
            r ^= r >>> 14;
            return (r >>> 0) / 4294967296;
        };
    }

    function shuffleWithSeed(array, seed) {
        const rand = mulberry32(seed);
        const arr = array.slice();
        for (let i = arr.length - 1; i > 0; i--) {
            const j = Math.floor(rand() * (i + 1));
            [arr[i], arr[j]] = [arr[j], arr[i]];
        }
        return arr;
    }

    function getLocalizedName(item, lang) {
        if (item[lang]) {
            return item[lang];
        }
        return item.id;
    }

    const langSelect = document.getElementById("langSelectTop");
    const gameModeSelect = document.getElementById("gameMode");
    const seedInput = document.getElementById("seedInput");
    const playersInput = document.getElementById("playersInput");
    const playerIndexInput = document.getElementById("playerIndexInput");
    const showRoleBtn = document.getElementById("showRoleBtn");
    const resultCard = document.getElementById("result");
    const roleText = document.getElementById("roleText");
    const extraText = document.getElementById("extraText");
    const errorBox = document.getElementById("errorBox");

    const headingEl = document.getElementById("heading");
    const subtitleEl = document.getElementById("subtitle");
    const labelGameEl = document.getElementById("labelGame");
    const helpGameModeEl = document.getElementById("helpGameMode");
    const labelSeedEl = document.getElementById("labelSeed");
    const helpSeedEl = document.getElementById("helpSeed");
    const labelPlayersEl = document.getElementById("labelPlayers");
    const helpPlayersEl = document.getElementById("helpPlayers");
    const labelPlayerIndexEl = document.getElementById("labelPlayerIndex");
    const helpPlayerIndexEl = document.getElementById("helpPlayerIndex");
    const resultTitleEl = document.getElementById("resultTitle");
    const footerTextEl = document.getElementById("footerText");

    function applyLang(lang) {
        const t = i18n[lang];
        document.title = t.pageTitle;
        headingEl.textContent = t.heading;
        subtitleEl.textContent = t.subtitle;
        labelGameEl.textContent = t.labelGame;
        helpGameModeEl.textContent = t.helpGameMode;
        labelSeedEl.textContent = t.labelSeed;
        seedInput.placeholder = t.seedPlaceholder;
        helpSeedEl.textContent = t.helpSeed;
        labelPlayersEl.textContent = t.labelPlayers;
        helpPlayersEl.textContent = t.helpPlayers;
        labelPlayerIndexEl.textContent = t.labelPlayerIndex;
        helpPlayerIndexEl.textContent = t.helpPlayerIndex;
        showRoleBtn.textContent = t.showButton;
        resultTitleEl.textContent = t.resultTitle;
        footerTextEl.textContent = t.footerText;

        const clashOption = gameModeSelect.querySelector('option[value="clash"]');
        const dotaOption = gameModeSelect.querySelector('option[value="dota"]');
        clashOption.textContent = gameModes.clash.title[lang];
        dotaOption.textContent = gameModes.dota.title[lang];
    }

    langSelect.addEventListener("change", () => {
        applyLang(langSelect.value);
        errorBox.style.display = "none";
        resultCard.style.display = "none";
    });

    function showError(msg) {
        errorBox.textContent = msg;
        errorBox.style.display = "block";
    }

    showRoleBtn.addEventListener("click", function () {
        errorBox.style.display = "none";
        resultCard.style.display = "none";

        const lang = langSelect.value;
        const t = i18n[lang];

        const seedStr = seedInput.value.trim();
        const playersCount = Number(playersInput.value);
        const playerIndex = Number(playerIndexInput.value);
        const modeKey = gameModeSelect.value;
        const mode = gameModes[modeKey];

        if (!seedStr) {
            showError(t.errors.noSeed);
            return;
        }
        if (!Number.isFinite(playersCount) || playersCount < 2) {
            showError(t.errors.playersMin);
            return;
        }
        if (playersCount > 10) {
            showError(t.errors.playersMax);
            return;
        }
        if (!Number.isFinite(playerIndex) || playerIndex < 1 || playerIndex > playersCount) {
            showError(t.errors.badIndex);
            return;
        }

        // мягкий античит: один и тот же seed + игра → один показ роли за сессию вкладки
        const sessionKey = "finkizet_seed_used_" + modeKey + "_" + seedStr;
        if (sessionStorage.getItem(sessionKey)) {
            showError(t.errors.cheat);
            return;
        }
        sessionStorage.setItem(sessionKey, "1");

        let seedNum = Number(seedStr);
        if (!Number.isFinite(seedNum)) {
            seedNum = hashStringToInt(seedStr);
        }
        if (seedNum === 0) {
            seedNum = 1;
        }

        const shuffledItems = shuffleWithSeed(mode.items, seedNum + 1);
        const sharedItem = shuffledItems[0];

        const roles = [];
        for (let i = 0; i < playersCount - 1; i++) {
            roles.push(sharedItem);
        }
        roles.push("spy");

        const shuffledRoles = shuffleWithSeed(roles, seedNum + 2);
        const myRole = shuffledRoles[playerIndex - 1];

        if (myRole === "spy") {
            roleText.textContent = t.spyRole;
            extraText.textContent = t.spyText(mode.title[lang], mode.label[lang]);
        } else {
            const itemName = getLocalizedName(myRole, lang);
            roleText.textContent = itemName;
            extraText.textContent = t.nonSpyText(mode.title[lang], mode.label[lang], itemName);
        }

        resultCard.style.display = "block";
    });

    // стартуем на русском
    applyLang("ru");
</script>
</body>
</html>
