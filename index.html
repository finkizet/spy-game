<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <title>finkizet game</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <style>
        * { box-sizing: border-box; }

        body {
            margin: 0; padding: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: #0f172a;
            color: #e5e7eb;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 480px;
            padding: 24px 16px 40px;
        }

        h1 { font-size: 1.6rem; margin-bottom: 8px; text-align: center; }

        .subtitle {
            font-size: 0.9rem; color: #9ca3af;
            text-align: center; margin-bottom: 20px;
        }

        label { display: block; font-size: 0.9rem; margin-bottom: 4px; }

        input, select {
            width: 100%; padding: 10px 12px; border-radius: 8px;
            border: 1px solid #374151; background: #020617;
            color: #e5e7eb; font-size: 0.95rem; margin-bottom: 14px; outline: none;
        }
        input:focus, select:focus { border-color: #3b82f6; }

        button {
            width: 100%; padding: 11px 14px; border-radius: 999px;
            border: none; cursor: pointer; font-weight: 600; font-size: 1rem;
            background: #3b82f6; color: #f9fafb; margin-top: 4px;
        }
        button:hover { filter: brightness(1.05); }
        button:active { transform: translateY(1px); }

        .help { font-size: 0.8rem; color: #9ca3af; margin-top: 4px; margin-bottom: 12px; }

        .result-card {
            margin-top: 18px; padding: 14px 16px; border-radius: 12px;
            background: #020617; border: 1px solid #1f2937;
        }
        .result-title { font-size: 0.85rem; color: #9ca3af; margin-bottom: 6px; }
        .role { font-size: 1.3rem; font-weight: 700; margin-bottom: 4px; }

        #serverStatus {
            font-size: 0.8rem; padding: 5px 0;

        #langSelectTop {
            width: auto; min-width: 110px; margin: 0;
            padding: 10px 32px 10px 10px;
            appearance: none; -webkit-appearance: none; -moz-appearance: none;
            background-color: #020617;

// ─── Утилиты ──────────────────────────────────────────────────
function hashStringToInt(str) {
    let h = 0;
    for (let i = 0; i < str.length; i++) h = (h * 31 + str.charCodeAt(i)) | 0;
    return h;
}
function mulberry32(seed) {
    let t = seed | 0;
    return function() {
        t += 0x6D2B79F5; let r = t;
        r = Math.imul(r ^ (r >>> 15), r | 1);
        r ^= r + Math.imul(r ^ (r >>> 7), r | 61);
        r ^= r >>> 14;
        return (r >>> 0) / 4294967296;
    };
}
function shuffleWithSeed(array, seed) {
    const rand = mulberry32(seed);
    const arr = array.slice();
    for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(rand() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
}
function getLocalizedName(item, lang) {
    if (!item) return '';
    if (item[lang]) return item[lang];
    return item.id || item;
}
function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

    onlineSubtitle.textContent      = t.onlineSubtitle;

// ─── Офлайн логика ────────────────────────────────────────────
function showErrorOffline(msg) { errorBoxOffline.textContent = msg; errorBoxOffline.style.display = 'block'; }

showRoleBtn.addEventListener('click', () => {
    errorBoxOffline.style.display = 'none';
    resultOffline.style.display   = 'none';
    const lang = langSelect.value;
    const t    = i18n[lang];
    if (!gameModes[gameModeOffline.value] || gameModes[gameModeOffline.value].items.length === 0) {
        showErrorOffline('Предметы ещё загружаются, попробуй через секунду.');
        return;
    }
    const seedStr     = seedInput.value.trim();
    const playersCount= Number(playersInput.value);
    const playerIndex = Number(playerIndexInput.value);
    const modeKey     = gameModeOffline.value;
    const mode        = gameModes[modeKey];

    if (!Number.isFinite(playersCount) || playersCount < 2) { showErrorOffline(t.errors.playersMin); return; }
    if (playersCount > 10) { showErrorOffline(t.errors.playersMax); return; }
    if (!Number.isFinite(playerIndex) || playerIndex < 1 || playerIndex > playersCount) { showErrorOffline(t.errors.badIndex); return; }
    if (!seedStr) { showErrorOffline(t.errors.noSeed); return; }

    const sessionKey = 'finkizet_seed_used_' + modeKey + '_' + seedStr;
    if (sessionStorage.getItem(sessionKey)) { showErrorOffline(t.errors.cheat); return; }
    sessionStorage.setItem(sessionKey, '1');

    let seedNum = Number(seedStr);
    if (!Number.isFinite(seedNum)) seedNum = hashStringToInt(seedStr);
    if (seedNum === 0) seedNum = 1;

    const sharedItem    = shuffleWithSeed(mode.items, seedNum + 1)[0];
    const roles         = [];
    for (let i = 0; i < playersCount - 1; i++) roles.push(sharedItem);
    roles.push('spy');
    const myRole = shuffleWithSeed(roles, seedNum + 2)[playerIndex - 1];

    if (myRole === 'spy') {
        roleTextOffline.textContent  = t.spyRole;
        extraTextOffline.textContent = t.spyText(mode.title[lang], mode.label[lang]);
    } else {
        const itemName = getLocalizedName(myRole, lang);
        roleTextOffline.textContent  = itemName;
        extraTextOffline.textContent = t.nonSpyText(mode.title[lang], mode.label[lang], itemName);
    }
    resultOffline.style.display = 'block';
});

// ─── Загрузка предметов из статических JSON (GitHub Pages) ──
async function loadGameItems() {
    try {
        const [clashResp, dotaResp] = await Promise.all([
            fetch('./game_items_clash.json'),
            fetch('./game_items_dota.json')
        ]);
        const clash = await clashResp.json();
        const dota  = await dotaResp.json();
        gameModes.clash.items = clash.items;
        gameModes.dota.items  = dota.items;
    } catch (e) {
        console.warn('Не удалось загрузить предметы:', e);
    }
}
loadGameItems();

// ─── Socket / Онлайн логика ───────────────────────────────────
const serverStatusEl = document.getElementById('serverStatus');
function setServerStatus(state) {
    // state: 'online' | 'offline' | 'connecting'
    serverStatusEl.className = state;
    if (state === 'online')     serverStatusEl.textContent = '● Сервер онлайн';
    if (state === 'offline')    serverStatusEl.textContent = '● Сервер недоступен';
    if (state === 'connecting') serverStatusEl.textContent = '○ Подключение...';
}
setServerStatus('connecting');

const socket = io(SERVER_BASE, { transports: ['websocket', 'polling'] });
let currentLobbyCode = null;

const NICK_KEY = 'finkizet_nick';
let localNick = localStorage.getItem(NICK_KEY) || '';
if (localNick) nickInput.value = localNick;

function showErrorOnline(msg) { errorBoxOnline.textContent = msg; errorBoxOnline.style.display = 'block'; }

nickInput.addEventListener('input', () => {
    const val = nickInput.value.trim();
    if (!val) return;
    localNick = val;
    localStorage.setItem(NICK_KEY, localNick);
    socket.emit('set_nick', localNick);
});

gameModeOnline.addEventListener('change', () => {
    if (!currentLobbyCode) return;
    socket.emit('change_game', { code: currentLobbyCode, gameKey: gameModeOnline.value }, (resp) => {
        if (resp && resp.error) showErrorOnline(resp.error);
    });
});

socket.on('connect', () => {
    const nick = nickInput.value.trim() || localNick || 'Player';
    socket.emit('set_nick', nick);
});
let _wakeInterval = null;
let _wakeDots = 0;
function startWakeBump() {
    if (_wakeInterval) return;
    _wakeDots = 0;
    const base = i18n[langSelect.value].serverWaking;
    errorBoxOnline.textContent = base;
    errorBoxOnline.style.display = 'block';
    _wakeInterval = setInterval(() => {
        _wakeDots = (_wakeDots + 1) % 4;
        errorBoxOnline.textContent = base + ' ' + '.'.repeat(_wakeDots || 1);
    }, 700);
}
function stopWakeBump() {
    if (_wakeInterval) { clearInterval(_wakeInterval); _wakeInterval = null; }
    errorBoxOnline.style.display = 'none';
}
socket.on('connect_error', () => { setServerStatus('offline'); startWakeBump(); });
socket.on('connect', () => { setServerStatus('online'); stopWakeBump(); });
socket.on('disconnect', () => { setServerStatus('offline'); });
socket.on('nick_set', (nick) => { localNick = nick; localStorage.setItem(NICK_KEY, nick); });

// динамический блок списка игроков
const lobbyListEl = document.createElement('div');
lobbyListEl.className = 'result-card';
lobbyListEl.style.display = 'none';
joinLobbyInput.after(lobbyListEl);

// создать лобби
createLobbyBtn.addEventListener('click', () => {
    errorBoxOnline.style.display = 'none';
    createLobbyBtn.disabled = true;
    socket.emit('create_lobby', { gameKey: gameModeOnline.value, playersCount: 10 }, (resp) => {
        createLobbyBtn.disabled = false;
        if (resp.error) { showErrorOnline(resp.error); return; }
        currentLobbyCode = resp.code;
        joinLobbyInput.value = resp.code;
        socket.emit('get_lobby', { code: resp.code }, (r) => { if (r.ok) renderLobbyState(r.lobby); });
    });
});

// войти в лобби
joinLobbyBtn.addEventListener('click', () => {
    const code = (joinLobbyInput.value || '').trim().toUpperCase();
    if (!code) { showErrorOnline('Введи код лобби'); return; }
    errorBoxOnline.style.display = 'none';
    joinLobbyBtn.disabled = true;
    socket.emit('join_lobby', { code, index: 'auto' }, (resp) => {
        joinLobbyBtn.disabled = false;
        if (resp.error) { showErrorOnline(resp.error); return; }
        currentLobbyCode = resp.code;
        socket.emit('get_lobby', { code: resp.code }, (r) => { if (r.ok) renderLobbyState(r.lobby); });
    });
});

// начать раунд
startRoundBtn.addEventListener('click', () => {
    socket.emit('start_round', { code: currentLobbyCode }, (resp) => {
        if (resp && resp.error) showErrorOnline(resp.error);
        else errorBoxOnline.style.display = 'none';
    });
});

// следующий раунд
nextRoundBtn.addEventListener('click', () => {
    socket.emit('end_round', { code: currentLobbyCode }, (resp) => {
        if (resp && resp.error) showErrorOnline(resp.error);
        else resultOnline.style.display = 'none';
    });
});

// выйти из лобби
leaveLobbyBtn.addEventListener('click', () => {
    if (!currentLobbyCode) return;
    socket.emit('leave_lobby', {}, (resp) => {
        if (resp && resp.ok) {
            currentLobbyCode = null;
            joinLobbyInput.value = '';
            renderLobbyState(null);
        }
    });
});

// ─── Рендер состояния лобби ───────────────────────────────────
function renderLobbyState(state) {
    const lang = langSelect.value;
    const t    = i18n[lang];
    if (!state) {
        lobbyListEl.style.display  = 'none';
        leaveLobbyBtn.style.display= 'none';
        startRoundBtn.style.display= 'none';
        nextRoundBtn.style.display = 'none';
        createLobbyBtn.style.display  = 'block';
        joinLobbyBtn.style.display    = 'block';
        labelJoinLobby.style.display  = 'block';
        joinLobbyInput.style.display  = 'block';
        labelGameOnline.style.display    = 'block';
        gameModeOnline.style.display     = 'block';
        helpGameModeOnline.style.display = 'block';
        return;
    }
    const isAdmin = (state.adminSocketId === socket.id);

    createLobbyBtn.style.display  = 'none';
    joinLobbyBtn.style.display    = 'none';
    labelJoinLobby.style.display  = 'none';
    joinLobbyInput.style.display  = 'none';
    lobbyListEl.style.display     = 'block';
    leaveLobbyBtn.style.display  = 'block';

    // тема — только у админа
    labelGameOnline.style.display    = isAdmin ? 'block' : 'none';
    gameModeOnline.style.display     = isAdmin ? 'block' : 'none';
    helpGameModeOnline.style.display = isAdmin ? 'block' : 'none';
    if (gameModeOnline.value !== state.gameKey) gameModeOnline.value = state.gameKey;

    if (state.state === 'in-round') {
        startRoundBtn.style.display = 'none';
        nextRoundBtn.style.display  = isAdmin ? 'block' : 'none';
    } else {
        startRoundBtn.style.display = isAdmin ? 'block' : 'none';
        nextRoundBtn.style.display  = 'none';
    }

    const playersHtml = state.players
        .sort((a, b) => a.index - b.index)
        .map(p => {
            const admin = p.socketId === state.adminSocketId ? ' (admin)' : '';
            return `<div class="lobby-player">${p.index}. ${escapeHtml(p.nick)}${admin}</div>`;
        }).join('');

    lobbyListEl.innerHTML = `
        <div class="lobby-box">
            <div><b>${t.lobbyWord}</b> ${state.code} — ${state.players.length}/${state.playersCount} ${state.state === 'in-round' ? t.inGame : ''}</div>
            <div>${playersHtml}</div>
        </div>`;
}

// ─── Socket события ───────────────────────────────────────────
socket.on('lobby_update',  (s) => renderLobbyState(s));
socket.on('round_started', (s) => renderLobbyState(s));
socket.on('round_ended',   (s) => renderLobbyState(s));

socket.on('role_assigned', ({ role, sharedLabel }) => {
    const lang = langSelect.value;
    const t    = i18n[lang];
    const mode = gameModes[sharedLabel];
    if (role && (role.id === 'spy' || role === 'spy')) {
        roleTextOnline.textContent  = t.spyRole;
        extraTextOnline.textContent = t.spyText(mode.title[lang], mode.label[lang]);
    } else {
        const name = getLocalizedName(role, lang);
        roleTextOnline.textContent  = name;
        extraTextOnline.textContent = t.nonSpyText(mode.title[lang], mode.label[lang], name);
    }
    resultOnline.style.display = 'block';
});

socket.on('kicked', ({ reason }) => {
    alert('Тебя кикнули: ' + (reason || ''));
    currentLobbyCode = null;
    renderLobbyState(null);
});

// ─── Dev: просмотр лобби через консоль ───────────────────────
// nrsc [n] — установить кол-во шпионов на следующий раунд
// nrsc reset — вернуть случайный режим
async function getAdminPassword() {
    let pwd = sessionStorage.getItem('spy_admin_pwd');
    if (pwd) return pwd;
    pwd = prompt('Пароль администратора:');
    if (!pwd) return null;
    // проверяем пароль через сервер
    const resp = await fetch(SERVER_BASE + '/api/admin/auth', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ password: pwd })
    });
    if (!resp.ok) { console.warn('Неверный пароль'); return null; }
    sessionStorage.setItem('spy_admin_pwd', pwd);
    console.log('✅ Авторизован до конца сеанса');
    return pwd;
}

window.nrsc = window.nextroundspycount = async function(count) {
    if (!currentLobbyCode) { console.warn('Ты не в лобби'); return; }
    const password = await getAdminPassword();
    if (!password) return;
    const isReset = count === 'reset' || count === null || count === undefined;
    socket.emit('set_next_spy_count', { code: currentLobbyCode, count: isReset ? null : Number(count), password }, (resp) => {
        if (!resp) { console.warn('Нет ответа от сервера'); return; }
        if (resp.error) { console.warn('Ошибка:', resp.error); return; }
        if (resp.mode === 'random') console.log('✅ Следующий раунд: случайное кол-во шпионов (default)');
        else console.log('✅ Следующий раунд: шпионов =', resp.count);
    });
};

window.debugLobbies = async function() {
    try {
        if (!socket.id) { console.warn('Сокет не подключён'); return; }
        const password = await getAdminPassword();
        if (!password) return;
        const resp = await fetch(SERVER_BASE + '/api/lobbies/debug?sid=' + encodeURIComponent(socket.id) + '&password=' + encodeURIComponent(password));
        if (!resp.ok) { console.warn('Сервер вернул', resp.status); return; }
        const data = await resp.json();
        console.group('🕵 Активные лобби (' + data.count + ')');
        data.lobbies.forEach(l => {
            console.group('Лобби ' + l.code + ' [' + l.state + '] gameKey=' + l.gameKey);
            console.log('Игроки (' + l.players.length + '):', l.players.map(p => p.index + '. ' + p.nick + (p.isAdmin ? ' (admin)' : '')).join(', '));
            console.log('Создано:', new Date(l.createdAt).toLocaleString());
            const nsc = l.nextSpyCount;
            console.log('Следующий раунд шпионов:', nsc && nsc.mode === 'set' ? 'задано: ' + nsc.count : 'random (default)');
            if (l.round) {
                console.group('Текущий раунд (начат ' + new Date(l.round.startedAt).toLocaleString() + ')');
                const item = l.round.sharedItem;
                console.log('Загадана карта/герой:', item ? (item.ru || item.id) + ' (' + item.id + ')' : '—');
                console.log('Шпионов:', l.round.spyCount);
                if (l.round.spies && l.round.spies.length > 0)
                    console.log('Шпионы:', l.round.spies.map(s => s.index + '. ' + s.nick).join(', '));
                else
                    console.log('Шпионов нет (все знают карту)');
                console.groupEnd();
            }
            console.groupEnd();
        });
        console.groupEnd();
        return data;
    } catch(e) {
        console.error('Ошибка:', e);
    }
};
</script>
