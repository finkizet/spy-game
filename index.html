            padding: 24px 16px 40px;
        }

        h1 {
            font-size: 1.6rem;
            margin-bottom: 8px;
            text-align: center;
        }

        .subtitle {
            font-size: 0.9rem;
            color: #9ca3af;
            text-align: center;
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-size: 0.9rem;
            margin-bottom: 4px;
        }

        input,
        select {
            width: 100%;
            padding: 10px 12px;
            border-radius: 8px;
            border: 1px solid #374151;
            background: #020617;
            color: #e5e7eb;
            font-size: 0.95rem;
            margin-bottom: 14px;
            outline: none;
        }

        input:focus,
        select:focus {
            border-color: #3b82f6;
        }

        button {
            width: 100%;
            padding: 11px 14px;
            border-radius: 999px;
            border: none;
            cursor: pointer;
            font-weight: 600;
            font-size: 1rem;
            background: #3b82f6;
            color: #f9fafb;
            margin-top: 4px;
        }

        button:hover { filter: brightness(1.05); }
        button:active { transform: translateY(1px); }

        .help {
            font-size: 0.8rem;
            color: #9ca3af;
            margin-top: 4px;
            margin-bottom: 12px;
        }

        .result-card {
            margin-top: 18px;
            padding: 14px 16px;
            border-radius: 12px;
            background: #020617;
            border: 1px solid #1f2937;
        }

        .result-title {
            font-size: 0.85rem;
            color: #9ca3af;
            margin-bottom: 6px;
        }

        .role {
            font-size: 1.3rem;
            font-weight: 700;
            margin-bottom: 4px;
        }

        .error {
            margin-top: 12px;
            padding: 10px 12px;
            border-radius: 8px;
            background: rgba(239, 68, 68, 0.08);
            border: 1px solid rgba(239, 68, 68, 0.5);
            color: #fecaca;
            font-size: 0.85rem;
        }

        .small {
            font-size: 0.8rem;
            color: #6b7280;
            margin-top: 16px;
        }

        /* Верхняя панель для выбора языка */
        #langTopBar {
            position: absolute; /* changed so it scrolls with page */
            top: 16px;
            right: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
            z-index: 10;
        }

        #langIcon {
            width: 20px;
            height: 20px;
            opacity: 0.9;
        }

        #langSelectTop {
            width: auto;
            min-width: 110px;
            margin: 0;
            padding-inline: 10px;
        }

        @media (max-width: 480px) {
            #langTopBar {
                top: 8px;
                right: 8px;
            }
        }

            width: auto;
            min-width: 110px;

            border-radius: 8px;
            color: #e5e7eb;

            top: 16px;

            gap: 4px;
            padding: 8px 12px;

            helpSeed: "All players must enter the same code. It can be a number or a word.",
            labelPlayers: "Number of players",
            helpPlayers: "Maximum is 10 players. There is always 1 spy, others get the same object.",
            labelPlayerIndex: "Your player number",
            helpPlayerIndex: "Each player chooses a unique number. It must not exceed the number of players.",
            showButton: "Show my role",
            resultTitle: "Your role:",
            footerText: "⚠ If someone enters a different code or player count, they will get different results. For a fair game everyone should type carefully and not peek.",
            spyRole: "Spy",
            createLobbyBtn: "Create online lobby",
            joinLobbyBtn: "Join lobby by code",
            joinLobbyLabel: "Lobby code",
            joinLobbyPlaceholder: "Example: ABC123",
            lobbyCreated: (code) => `Lobby created: ${code}. Share the code.`,
            lobbyJoined: () => `You joined the lobby. Token saved locally.`,
            errors: {
                noSeed: "Enter the shared code / seed.",
                playersMin: "Number of players must be at least 2.",
                playersMax: "Maximum number of players is 10.",
                badIndex: "Player number must be between 1 and the total number of players.",
                cheat: "Play fair! Don't peek! If you think this is a mistake, choose another code."
            },
            spyText(modeTitle, label) {
                return `You are the spy in ${modeTitle}. You do NOT know which ${label} everyone else got. Listen to how they describe it and try not to get caught.`;
            },
            nonSpyText(modeTitle, label, itemName) {
                return `You got a ${label}: "${itemName}". All non-spies have the same ${label}. Do not show your screen, just remember it and describe it so the spy cannot easily guess what it is.`;
            }
        }
    };

    // Utils (hash + RNG + shuffle)
    function hashStringToInt(str) {
        let h = 0;
        for (let i = 0; i < str.length; i++) {
            h = (h * 31 + str.charCodeAt(i)) | 0;
        }
        return h;
    }

    function mulberry32(seed) {
        let t = seed | 0;
        return function() {
            t += 0x6D2B79F5;
            let r = t;
            r = Math.imul(r ^ (r >>> 15), r | 1);
            r ^= r + Math.imul(r ^ (r >>> 7), r | 61);
            r ^= r >>> 14;
            return (r >>> 0) / 4294967296;
        };
    }

    function shuffleWithSeed(array, seed) {
        const rand = mulberry32(seed);
        const arr = array.slice();
        for (let i = arr.length - 1; i > 0; i--) {
            const j = Math.floor(rand() * (i + 1));
            [arr[i], arr[j]] = [arr[j], arr[i]];
        }
        return arr;
    }

    function getLocalizedName(item, lang) {
        if (!item) return '';
        if (item[lang]) {
            return item[lang];
        }
        return item.id || item;
    }

    // DOM refs
    const langSelect = document.getElementById("langSelectTop");
    const gameModeSelect = document.getElementById("gameMode");
    const seedInput = document.getElementById("seedInput");
    const playersInput = document.getElementById("playersInput");
    const playerIndexInput = document.getElementById("playerIndexInput");
    const showRoleBtn = document.getElementById("showRoleBtn");
    const resultCard = document.getElementById("result");
    const roleText = document.getElementById("roleText");
    const extraText = document.getElementById("extraText");
    const errorBox = document.getElementById("errorBox");
    const createLobbyBtn = document.getElementById("createLobbyBtn");
    const joinLobbyBtn = document.getElementById("joinLobbyBtn");
    const joinLobbyInput = document.getElementById("joinLobbyInput");

    const headingEl = document.getElementById("heading");
    const subtitleEl = document.getElementById("subtitle");
    const labelGameEl = document.getElementById("labelGame");
    const helpGameModeEl = document.getElementById("helpGameMode");
    const labelSeedEl = document.getElementById("labelSeed");
    const helpSeedEl = document.getElementById("helpSeed");
    const labelPlayersEl = document.getElementById("labelPlayers");
    const helpPlayersEl = document.getElementById("helpPlayers");
    const labelPlayerIndexEl = document.getElementById("labelPlayerIndex");
    const helpPlayerIndexEl = document.getElementById("helpPlayerIndex");
    const resultTitleEl = document.getElementById("resultTitle");
    const footerTextEl = document.getElementById("footerText");
    const labelJoinLobby = document.getElementById("labelJoinLobby");

    function applyLang(lang) {
        const t = i18n[lang];
        document.title = t.pageTitle;
        headingEl.textContent = t.heading;
        subtitleEl.textContent = t.subtitle;
        labelGameEl.textContent = t.labelGame;
        helpGameModeEl.textContent = t.helpGameMode;
        labelSeedEl.textContent = t.labelSeed;
        seedInput.placeholder = t.seedPlaceholder;
        helpSeedEl.textContent = t.helpSeed;
        labelPlayersEl.textContent = t.labelPlayers;
        helpPlayersEl.textContent = t.helpPlayers;
        labelPlayerIndexEl.textContent = t.labelPlayerIndex;
        helpPlayerIndexEl.textContent = t.helpPlayerIndex;
        showRoleBtn.textContent = t.showButton;
        resultTitleEl.textContent = t.resultTitle;
        footerTextEl.textContent = t.footerText;

        labelJoinLobby.textContent = t.joinLobbyLabel;
        joinLobbyInput.placeholder = t.joinLobbyPlaceholder;
        createLobbyBtn.textContent = t.createLobbyBtn;
        joinLobbyBtn.textContent = t.joinLobbyBtn;

        const clashOption = gameModeSelect.querySelector('option[value="clash"]');
        const dotaOption = gameModeSelect.querySelector('option[value="dota"]');
        clashOption.textContent = gameModes.clash.title[lang];
        dotaOption.textContent = gameModes.dota.title[lang];
    }

    langSelect.addEventListener("change", () => {
        applyLang(langSelect.value);
        errorBox.style.display = "none";
        resultCard.style.display = "none";
    });

    function showError(msg) {
        errorBox.textContent = msg;
        errorBox.style.display = "block";
    }

    // Main "show role" logic — supports online (if lobby code + token) and offline (local seed)
    showRoleBtn.addEventListener("click", async function () {
        errorBox.style.display = "none";
        resultCard.style.display = "none";

        const lang = langSelect.value;
        const t = i18n[lang];

        const seedStr = seedInput.value.trim();
        const playersCount = Number(playersInput.value);
        const playerIndex = Number(playerIndexInput.value);
        const modeKey = gameModeSelect.value;
        const mode = gameModes[modeKey];

        if (!modeKey) {
            showError("Choose a game.");
            return;
        }

        if (!Number.isFinite(playersCount) || playersCount < 2) {
            showError(t.errors.playersMin);
            return;
        }
        if (playersCount > 10) {
            showError(t.errors.playersMax);
            return;
        }
        if (!Number.isFinite(playerIndex) || playerIndex < 1 || playerIndex > playersCount) {
            showError(t.errors.badIndex);
            return;
        }

        // If user provided lobby code -> try online flow
        const lobbyIdRaw = (joinLobbyInput.value || '').trim();
        const lobbyId = lobbyIdRaw ? lobbyIdRaw.toUpperCase() : null;

        if (lobbyId) {
            // online mode: require token saved locally
            const token = localStorage.getItem('lobby_token_' + lobbyId);
            if (!token) {
                showError("No token found for this lobby. First click 'Join lobby' and save your token.");
                return;
            }
            // request role from server
            const resp = await getRoleFromLobby(lobbyId, token);
            if (!resp) {
                showError("Network error");
                return;
            }
            if (resp.error) {
                showError(resp.error);
                return;
            }
            const myRole = resp.role;
            // myRole can be string 'spy' or object {id:..., ru:...}
            if ((typeof myRole === 'string' && myRole === 'spy') || (myRole && myRole.id === 'spy')) {
                roleText.textContent = t.spyRole;
                extraText.textContent = t.spyText(mode.title[lang], mode.label[lang]);
            } else {
                const itemName = getLocalizedName(myRole, lang);
                roleText.textContent = itemName;
                extraText.textContent = t.nonSpyText(mode.title[lang], mode.label[lang], itemName);
            }
            resultCard.style.display = "block";
            return;
        }

        // OFFLINE flow (legacy): one seed -> one show per sessionStorage (soft anti-cheat)
        if (!seedStr) {
            showError(t.errors.noSeed);
            return;
        }

        // session anti-cheat (only for offline)
        const sessionKey = "finkizet_seed_used_" + modeKey + "_" + seedStr;
        if (sessionStorage.getItem(sessionKey)) {
            showError(t.errors.cheat);
            return;
        }
        sessionStorage.setItem(sessionKey, "1");

        let seedNum = Number(seedStr);
        if (!Number.isFinite(seedNum)) {
            seedNum = hashStringToInt(seedStr);
        }
        if (seedNum === 0) seedNum = 1;

        const shuffledItems = shuffleWithSeed(mode.items, seedNum + 1);
        const sharedItem = shuffledItems[0];

        const roles = [];
        for (let i = 0; i < playersCount - 1; i++) roles.push(sharedItem);
        roles.push("spy");

        const shuffledRoles = shuffleWithSeed(roles, seedNum + 2);
        const myRole = shuffledRoles[playerIndex - 1];

        if (myRole === "spy") {
            roleText.textContent = t.spyRole;
            extraText.textContent = t.spyText(mode.title[lang], mode.label[lang]);
        } else {
            const itemName = getLocalizedName(myRole, lang);
            roleText.textContent = itemName;
            extraText.textContent = t.nonSpyText(mode.title[lang], mode.label[lang], itemName);
        }

        resultCard.style.display = "block";
    });

    // Start with Russian
    applyLang("ru");

    // ---------- Socket client integration ----------
const SOCKET_URL = SERVER_BASE; // например https://spy-game-clr8.onrender.com
const socket = io(SOCKET_URL, { transports: ['websocket', 'polling'] });

// nickname handling (localStorage)
const NICK_KEY = 'finkizet_nick';
let localNick = localStorage.getItem(NICK_KEY) || '';
if (!localNick) {
  // ask user for nick (simple prompt) — ты можешь заменить на UI input
  localNick = prompt('Enter your nickname', 'Player') || 'Player';
  localStorage.setItem(NICK_KEY, localNick);
}
socket.emit('set_nick', localNick);
socket.on('nick_set', (nick) => {
  localNick = nick;
  localStorage.setItem(NICK_KEY, nick);
});

lobbyListEl.className = 'result-card';
lobbyListEl.style.display = 'none';
joinLobbyInput.after(lobbyListEl);

// Create lobby
createLobbyBtn.addEventListener('click', () => {
  const modeKey = gameModeSelect.value;
  const playersCount = Number(playersInput.value) || 4;
  const t = i18n[langSelect.value];
  
  if (!modeKey) { showError("Choose a game."); return; }
  if (playersCount < 2) { showError(t.errors.playersMin); return; }
  if (playersCount > 10) { showError(t.errors.playersMax); return; }
  
  createLobbyBtn.disabled = true;
  errorBox.style.display = "none";
  
  socket.emit('create_lobby', { gameKey: modeKey, playersCount }, (resp) => {
    createLobbyBtn.disabled = false;
    if (resp.error) { showError(resp.error); return; }
    
    localStorage.setItem('lastLobbyId', resp.code);
    joinLobbyInput.value = resp.code;
    alert(t.lobbyCreated(resp.code));
    
    socket.emit('get_lobby', { code: resp.code }, (r) => {
      if (r.ok) renderLobbyState(r.lobby);
    });
  });
});

// Join lobby
joinLobbyBtn.addEventListener('click', () => {
  const code = (joinLobbyInput.value||'').trim().toUpperCase();
  const t = i18n[langSelect.value];
  if (!code) { showError('Enter lobby code'); return; }
  
  const index = Number(playerIndexInput.value);
  if (!index || index < 1) { showError(t.errors.badIndex); return; }
  
  joinLobbyBtn.disabled = true;
  errorBox.style.display = "none";
  
  socket.emit('join_lobby', { code, index }, (resp) => {
    joinLobbyBtn.disabled = false;
    if (resp.error) { showError(resp.error); return; }
    
    localStorage.setItem('lastLobbyId', resp.code);
    alert(t.lobbyJoined());
    
    socket.emit('get_lobby', { code: resp.code }, (r) => {
      if (r.ok) renderLobbyState(r.lobby);
    });
  });
});

    
// helper UI refs (создай/переиспользуй свои элементы)
const lobbyListEl = document.createElement('div'); // можно вставить куда хочешь

function renderLobbyState(state) {
  if (!state) { lobbyListEl.innerHTML = ''; return; }
  const playersHtml = state.players
    .sort((a,b)=>a.index-b.index)
    .map(p => {
      const isAdmin = (p.socketId === state.adminSocketId);
      return `<div class="lobby-player">${p.index}. ${escapeHtml(p.nick)} ${isAdmin?'<b>*</b>':''}</div>`;
    }).join('');
  lobbyListEl.innerHTML = `
    <div class="lobby-box">
      <div><b>Lobby</b> ${state.code} — ${state.players.length}/${state.playersCount}</div>
      <div>${playersHtml}</div>
    </div>
  `;
}

// escape helper
function escapeHtml(s){ return String(s).replace(/[&<>"']/g, m=>({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[m])); }


// listen for lobby updates broadcast
socket.on('lobby_update', (state) => {
  renderLobbyState(state);
});

// private role message
socket.on('role_assigned', ({ role, index, sharedLabel }) => {
  // show role to user — можно использовать существующий UI resultCard
  if (role && (role.id === 'spy' || role === 'spy')) {
    roleText.textContent = i18n[langSelect.value].spyRole;
    extraText.textContent = i18n[langSelect.value].spyText(gameModes[sharedLabel].title[langSelect.value], gameModes[sharedLabel].label[langSelect.value]);
  } else {
    const name = getLocalizedName(role, langSelect.value);
    roleText.textContent = name;
    extraText.textContent = i18n[langSelect.value].nonSpyText(gameModes[sharedLabel].title[langSelect.value], gameModes[sharedLabel].label[langSelect.value], name);
  }
  resultCard.style.display = 'block';
});

// round started/ended notifications
socket.on('round_started', (state) => {
  renderLobbyState(state);
});
socket.on('round_ended', (state) => {
  renderLobbyState(state);
});

// handle kicked
socket.on('kicked', ({ reason }) => {
  alert('You were kicked: ' + (reason||''));
  // optionally reload or redirect
});

// utility: admin controls in client (simple prompt flows)
function startRoundClient() {
  const code = localStorage.getItem('lastLobbyId');
  if (!code) return alert('No lobby code stored');
  const spyCount = 1;
  socket.emit('start_round', { code, spyCount }, (r) => {
    if (r && r.error) alert(r.error);
  });
}
function endRoundClient() {
  const code = localStorage.getItem('lastLobbyId');
  socket.emit('end_round', { code }, (r) => { if (r && r.error) alert(r.error); });
}
function kickClient(index) {
  const code = localStorage.getItem('lastLobbyId');
  socket.emit('kick', { code, targetIndex: index }, (r) => { if (r && r.error) alert(r.error); });
}
